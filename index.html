<style>
:root{--bg:#1e2338;--card:#2b3250;--tx:#fff;--mu:#a9b0c8;--rd:#e8392f;--rd2:#3d2a3a;--bd:#3a4262;--gd:#f3b400;color-scheme:dark;box-sizing:border-box}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(70px + env(safe-area-inset-bottom,0px))}
.top{background:var(--bg);color:#fff;padding:calc(12px + env(safe-area-inset-top,0px)) 14px 12px;display:flex;justify-content:space-between;align-items:center;font-weight:700;position:sticky;top:0;z-index:5}
.top::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:6}
.w{max-width:560px;margin:0 auto;padding:12px}
.ban{border-radius:14px;padding:18px;color:#fff;background:linear-gradient(135deg,#1a0000,#7a0000 60%,#c40000);margin-bottom:14px}
.ban h2{margin:0;font-size:26px;line-height:1.05;font-style:italic}
.ban p{margin:8px 0 0;font-size:13px;opacity:.85}
h3{margin:14px 0 8px;font-size:16px}
.chips{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto}
.chips button{padding:8px 14px;border-radius:20px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:13px;font-weight:600;white-space:nowrap}
.chips button.on{background:var(--rd);color:#fff;border-color:var(--rd)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px}
.sp{justify-content:space-between;margin-bottom:10px}
.ic{width:34px;height:34px;border-radius:9px;background:var(--rd2);display:grid;place-items:center}
.mu{color:var(--mu);font-size:12px}
.tag{background:var(--rd2);border:1px solid var(--rd);color:var(--rd);border-radius:8px;padding:4px 8px;text-align:center;font-size:12px;line-height:1.2}
.big{font-size:24px;font-weight:800;color:var(--rd)}
.pill{background:var(--rd2);color:var(--rd);border:1px solid var(--rd);border-radius:20px;padding:6px 12px;font-size:12px;font-weight:600}

  const m=M.find(x=>x.id==id);

function promoGen(){
  const L=gpl();
  return `<div class="card"><b>🎁 Promo Code Banao</b><div class="mu" style="margin:6px 0">Code se user ko coins milenge. Ek user ek code sirf ek baar use kar sakta hai.</div>

  <button class="btn w100" onclick="genPromo()">CODE BANAO</button>
  ${L.length?`<h3 style="margin:12px 0 6px;font-size:15px">Banaye gaye codes</h3>`+L.slice().reverse().map(x=>`<div class="li"><span><b>${esc(x.c)}</b> · 🪙${x.v}</span></div>`).join(""):""}</div>`;
}
async function genPromo(){
  const v=Math.floor(+$("pgc").value);
  if(!(v>0)){alert("Coins ki sahi number daalo (1 ya usse zyada)");return}
  let c=$("pgn").value.trim().toUpperCase().replace(/\s/g,"");
  if(!c){const ch="ABCDEFGHJKLMNPQRSTUVWXYZ23456789",r=crypto.getRandomValues(new Uint8Array(8));c="";for(const x of r)c+=ch[x%ch.length]}
  if(!/^[A-Z0-9_-]{4,20}$/.test(c)){alert("Code 4 se 20 akshar ka ho (sirf A-Z aur 0-9)");return}
  const {error}=await sb.rpc("create_promo",{p_code:c,p_coins:v});
  if(error){alert(/duplicate/i.test(error.message)?"Ye code pehle se bana hai":error.message);return}
  const L=gpl();L.push({c,v,t:Date.now()});
  try{localStorage.setItem("ffapromolist",JSON.stringify(L))}catch(e){}
  alert("Code ban gaya: "+c+" (🪙"+v+" coins)");R();
}
function addMatch(){
  const v=i=>$(i).value.trim(),r=+v('xw'),x=+v('xx');
  if(!v('xd')||!v('xt')||!(r>=0)||v('xw')===''||!(x>=2)){alert('Date, time, reward aur max players (kam se kam 2) bharo');return}
  M.push({id:M.reduce((a,b)=>Math.max(a,b.id),0)+1,mo:v('xm'),mp:v('xp'),ru:v('xr')||'Normal',gn:v('xg')||'All Guns',d:v('xd'),tm:v('xt'),r,j:0,fee:Math.max(0,Math.floor(+v('xf')||0)),x});
  saveM();R();alert('Match add ho gaya');
}
function setFee(id){
  const m=M.find(x=>x.id==id);if(!m)return;

  m.fee=f;saveM();R();
}
function delMatch(id){
  if(!confirm('Match #'+id+' remove karna hai?'))return;

  if(!q||!p){alert("Username ya mobile aur password dono daalo");return}
  const {data:email,error:e1}=await sb.rpc("login_email",{identifier:q});
  if(e1||!email){alert("Username ya mobile number galat hai");return}
  const {error}=await sb.auth.signInWithPassword({email,password:p});
  if(error){alert("Password galat hai");return}
  await loadMe();AV={};R();
}
async function doSign(){
  const n=$("an").value.trim(),un=$("au").value.trim(),m=$("am").value.trim(),p=$("ap").value;
  if(!n||!/^[6-9]\d{9}$/.test(m)){alert("Naam aur sahi 10 digit mobile number daalo");return}
  if(p.length<6||p!=$("ap2").value){alert("Password kam se kam 6 akshar ka ho aur dono baar same ho");return}
  if(!/^[A-Za-z0-9_]{3,15}$/.test(un)){alert("Username 3 se 15 akshar ka ho (sirf A-Z, 0-9 aur _)");return}
  const email=m+"@ffesport.app";
  const {error}=await sb.auth.signUp({email,password:p,options:{data:{name:n,username:un,mobile:m}}});
  if(error){
    const dup=/Database error|duplicate|already/i.test(error.message);
    alert(dup?"Ye username ya mobile number pehle se registered hai":"Account nahi bana: "+error.message);
    return;
  }
  const {error:e2}=await sb.auth.signInWithPassword({email,password:p});
  if(e2){alert("Account ban gaya. Ab login karo.");AM="login";AV={};R();return}
  await loadMe();AV={};R();
}
async function logout(){
  try{await sb.auth.signOut()}catch(e){}
  ME="";PROF={};ADM=false;WAL=0;view="home";AM="login";AV={};R();
}
(async()=>{try{await loadMe()}catch(e){}R()})();
if("serviceWorker"in navigator&&location.protocol.startsWith("http"))addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
