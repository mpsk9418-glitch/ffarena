<style>
:root{--bg:#1e2338;--card:#2b3250;--tx:#fff;--mu:#a9b0c8;--rd:#e8392f;--rd2:#3d2a3a;--bd:#3a4262;--gd:#f3b400;color-scheme:dark;box-sizing:border-box}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(70px + env(safe-area-inset-bottom,0px))}
.top{background:var(--bg);color:#fff;padding:calc(12px + env(safe-area-inset-top,0px)) 14px 12px;display:flex;justify-content:space-between;align-items:center;font-weight:700;position:sticky;top:0;z-index:5}
.top::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:6}
.w{max-width:560px;margin:0 auto;padding:12px}
.ban{border-radius:14px;padding:18px;color:#fff;background:linear-gradient(135deg,#1a0000,#7a0000 60%,#c40000);margin-bottom:14px}
.ban h2{margin:0;font-size:26px;line-height:1.05;font-style:italic}
.ban p{margin:8px 0 0;font-size:13px;opacity:.85}
h3{margin:14px 0 8px;font-size:16px}
.chips{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto}
.chips button{padding:8px 14px;border-radius:20px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:13px;font-weight:600;white-space:nowrap}
.chips button.on{background:var(--rd);color:#fff;border-color:var(--rd)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px}
.sp{justify-content:space-between;margin-bottom:10px}
.ic{width:34px;height:34px;border-radius:9px;background:var(--rd2);display:grid;place-items:center}
.mu{color:var(--mu);font-size:12px}
.tag{background:var(--rd2);border:1px solid var(--rd);color:var(--rd);border-radius:8px;padding:4px 8px;text-align:center;font-size:12px;line-height:1.2}
.big{font-size:24px;font-weight:800;color:var(--rd)}
.pill{background:var(--rd2);color:var(--rd);border:1px solid var(--rd);border-radius:20px;padding:6px 12px;font-size:12px;font-weight:600}
.bar{flex:1;height:6px;background:var(--bd);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--rd)}
.btn{background:var(--rd);color:#fff;border:0;border-radius:8px;padding:11px 18px;font-weight:800;font-size:14px}
.btn.off{background:var(--bd);color:var(--mu)}
.btn.w100{width:100%}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;color:var(--mu);padding:10px 0;font-size:11px;font-weight:600}
nav button span{display:block;font-size:20px}
nav button.on{color:var(--rd)}
.st{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.st .card{margin:0;text-align:center}
.st b{display:block;font-size:22px}
.seg{display:flex;margin-bottom:12px}
.seg button{flex:1;padding:10px;border:1px solid var(--rd);background:var(--card);color:var(--rd);font-weight:700}
.seg button.on{background:var(--rd);color:#fff}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;text-align:center;font-size:12px}
.g4 b{display:block;font-size:13px}
.li{display:flex;justify-content:space-between;padding:8px 0;font-size:14px;border-bottom:1px solid var(--bd)}
.li:last-child{border:0}
.pod{display:flex;align-items:flex-end;justify-content:center;gap:8px;margin:10px 0 14px;text-align:center}
.pod div{border-radius:12px;padding:10px 6px;width:30%;background:var(--card);border:1px solid var(--bd)}
.pod .f{padding:18px 6px;border-color:var(--gd)}
.pod b{display:block;font-size:18px}
.timer{font-size:20px;font-weight:800;color:var(--rd);text-align:center}
.lock{background:var(--bg);border:1px dashed var(--bd);border-radius:10px;padding:8px;font-size:12px;color:var(--mu);text-align:center}
.back{background:none;border:0;color:#fff;font-size:22px;padding:0 8px 0 0}
.coin{background:#fff;color:#111;border-radius:8px;padding:6px 12px;font-weight:800;font-size:14px}
.sl{position:relative;overflow:hidden;border-radius:12px;margin-bottom:12px;aspect-ratio:1080/613;background:#2b3250}
.st2{display:flex;height:100%;transition:transform .5s ease}
.sd{flex:0 0 100%;height:100%;position:relative}
.sd img{width:100%;height:100%;object-fit:cover;display:block}
.sx{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:0 7%;color:#fff}
.sx small{font-size:12px;letter-spacing:2px;opacity:.85;font-weight:700}
.sx b{font-size:clamp(22px,7vw,34px);line-height:1.1;margin:6px 0;font-style:italic;text-shadow:0 2px 6px rgba(0,0,0,.35)}
.sx span{font-size:13px;opacity:.9}
.sx .tb{display:inline-block;align-self:flex-start;background:#fff;color:#0f2a6b;font-weight:800;border-radius:20px;padding:7px 14px;opacity:1;margin-top:4px}
.dt{position:absolute;left:0;right:0;bottom:8px;display:flex;justify-content:center;gap:6px}
.dt i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.5)}
.dt i.on{background:#fff;width:18px;border-radius:4px}
.ann{display:flex;background:#fff;color:#555;border-radius:8px;overflow:hidden;margin-bottom:12px;font-size:13px}
.ann i{background:#eee;padding:10px 12px;font-style:normal}
.ann span{padding:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ban2{height:150px;border-radius:12px;background:linear-gradient(120deg,#2b0a4a,#c2410c 70%,#f59e0b);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:26px;letter-spacing:1px;text-align:center;line-height:1.1}
.dots{text-align:center;margin:8px 0}
.dots i{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--bd);margin:0 3px}
.dots i.on{background:#fff}
.gm{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.gm button{background:var(--card);border:3px solid var(--bd);border-radius:14px;padding:0;overflow:hidden;color:#111}
.gm .im{height:96px;display:grid;place-items:center;font-size:42px}
.gm b{display:block;background:#fff;padding:8px 0;font-size:13px}
.tg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.tg span{background:var(--rd2);border-radius:20px;padding:3px 10px;font-size:11px;color:var(--mu)}
.au input{width:100%;padding:12px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit;margin-bottom:10px}
.gbtn{width:100%;background:#fff;color:#222;border:0;border-radius:8px;padding:12px;font-weight:700;font-size:14px;margin-bottom:14px}
.lk{text-align:center;font-size:12px;font-weight:700;line-height:2}
.lk a{color:var(--gd);cursor:pointer}
#nav button{position:relative}.nb{position:absolute;top:2px;right:18%;background:#e8392f;color:#fff;border-radius:10px;font:700 11px/1 sans-serif;padding:3px 6px;font-style:normal}
.nt{background:#e8392f;color:#fff;border-radius:10px;padding:10px 12px;margin-bottom:10px;font-weight:700;cursor:pointer}
.ci{width:100%;padding:11px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit;margin-bottom:10px}
.bd{display:inline-block;border-radius:20px;padding:3px 10px;font-size:11px;font-weight:700}
.bd.p{background:#4a3b12;color:var(--gd)}.bd.o{background:#12402a;color:#3ddc84}.bd.x{background:#4a1a1a;color:#ff6b6b}

.inst{display:flex;align-items:center;justify-content:space-between;gap:10px;background:linear-gradient(90deg,#2a1b4d,#3b1d6e);border:1px solid #6a3fc4;border-radius:4px;padding:10px 12px;margin-bottom:10px;font-weight:700;font-size:14px}.inst .btn{padding:8px 14px;white-space:nowrap}

/* ===== SURJO FF TOURNAMENT look: teal-black, saffron, Rajdhani + Hind ===== */
:root{--bg:#0d1418;--card:#152027;--card2:#1b2a33;--tx:#e9eff2;--mu:#8fa1ab;--rd:#f5a524;--rd2:#1b2a33;--bd:#27373f;--gd:#f5a524;--cy:#f5a524;--ink:#1a1100;--live:#ff6a55;--ok:#4cc38a;
--fh:'Rajdhani','Arial Narrow',system-ui,sans-serif;--fb:'Hind',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color-scheme:dark}
html{background:var(--bg)}
body{background:var(--bg);color:var(--tx);font-family:var(--fb);font-size:15px;line-height:1.45}
.w{padding:16px}
.top{background:var(--bg);border-bottom:1px solid var(--bd)}
.top::before{background:var(--bg)}
#ttl{font-family:var(--fh);font-weight:700;font-style:normal;font-size:21px;letter-spacing:.08em}
#tl{width:36px!important;height:36px!important;object-fit:cover;background:#000;border:1px solid var(--bd)}
.coin{background:var(--card)!important;color:var(--gd)!important;border:1px solid var(--bd);border-radius:999px;padding:6px 14px;font-family:var(--fh);font-weight:700;font-size:16px!important;clip-path:none}
h3{font-family:var(--fh);font-size:13px;font-weight:600;font-style:normal;letter-spacing:.16em;text-transform:uppercase;color:var(--mu);margin:20px 0 10px;padding:0;border:0;line-height:1.1}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;clip-path:none}
.st .card,.g4,.pod div{clip-path:none}
.big{font-family:var(--fh);font-style:normal;font-weight:700;font-size:30px;color:var(--gd);letter-spacing:.02em}
.card b{font-family:var(--fh);font-weight:700;letter-spacing:.02em;font-size:1.08em}
.ic{border-radius:10px;background:var(--card2);border:1px solid var(--bd)}
.tag{border-radius:8px;background:var(--card2);color:var(--gd);border:1px solid var(--bd);font-family:var(--fh)}
.tag b{color:var(--tx)}
.pill{border-radius:999px;background:transparent;color:var(--tx);border:1px solid var(--bd);font-family:var(--fh);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.tg span{border-radius:999px;background:var(--bg);border:1px solid var(--bd);color:var(--mu)}
.bar{height:5px;border-radius:5px;background:var(--bd)}
.bar i{border-radius:5px;background:var(--gd)}
.btn{border-radius:10px;background:var(--gd);border:1px solid var(--gd);color:var(--ink);font-family:var(--fh);font-weight:700;font-size:15px;letter-spacing:.08em;text-transform:uppercase;clip-path:none;box-shadow:none}
.btn.off,.b2{background:var(--card2);border:1px solid var(--bd);color:var(--mu)}
.b2{border-radius:10px;padding:10px 16px;font-family:var(--fh);font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.chips button{border-radius:999px;background:var(--card);border:1px solid var(--bd);color:var(--mu);font-family:var(--fh);font-size:14px;font-weight:700;letter-spacing:.05em}
.chips button.on{background:var(--gd);border-color:var(--gd);color:var(--ink)}
.seg{border:1px solid var(--bd);border-radius:10px;overflow:hidden}
.seg button{border:0;border-radius:0;background:var(--card);color:var(--mu);font-family:var(--fh);font-size:15px;font-weight:700;letter-spacing:.08em}
.seg button.on{background:var(--gd);color:var(--ink)}
.st b{font-family:var(--fh);font-size:30px;font-style:normal;font-weight:700;color:var(--gd)}
.timer{font-family:var(--fh);font-weight:700;color:var(--gd);font-size:28px;letter-spacing:.04em;font-variant-numeric:tabular-nums}
.ann{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:10px}
.ann i{background:var(--gd);color:var(--ink)}
.gm{gap:10px}
.gm button{background:var(--card);border:1px solid var(--bd);border-radius:14px;clip-path:none}
.gm button:active{transform:scale(.97)}
.gm .im{background:linear-gradient(160deg,#1b2a33,#101a20)!important}
.gm b{background:var(--card);color:var(--tx);font-family:var(--fh);font-size:15px;font-weight:700;letter-spacing:.04em;padding:9px 0;border-top:1px solid var(--bd)}
.sl{border-radius:16px;clip-path:none;border:1px solid var(--bd)}
.sx b,.sx small{font-family:var(--fh);font-style:normal}
.sx .tb{border-radius:999px;background:var(--gd);color:var(--ink);font-family:var(--fh);font-size:15px}
.dt i{border-radius:3px;height:4px;width:14px;background:rgba(255,255,255,.35)}
.dt i.on{background:var(--gd);width:26px;border-radius:3px}
nav{background:var(--card);border-top:1px solid var(--bd)}
nav button{font-family:var(--fh);font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:14px 2px 12px;position:relative;white-space:nowrap}
nav button span{display:none}
nav button.on{color:var(--gd)}
nav button.on::before{content:"";position:absolute;top:0;left:26%;right:26%;height:2px;background:var(--gd)}
.nb{border-radius:999px!important;background:var(--live)!important;color:#1a0500!important;top:6px!important;right:8%!important}
.nt{border-radius:12px;background:#2a1814;border:1px solid var(--live);color:var(--tx)}
.li{border-bottom:1px solid var(--bd)}
.lock{border-radius:10px;background:var(--bg)}
.ci,.au input,#app input,#app select{border-radius:10px!important;background:var(--bg)!important;border:1px solid var(--bd)!important;color:var(--tx)!important;font-family:var(--fb)}
#app input:focus,#app select:focus{outline:2px solid var(--gd);outline-offset:0;border-color:var(--gd)!important}
.back{color:var(--gd);font-weight:700}
.bd{border-radius:999px;font-family:var(--fh);font-size:12px;letter-spacing:.06em}
.bd.p{background:#3a2d10;color:var(--gd)}.bd.o{background:#12402a;color:var(--ok)}.bd.x{background:#3a1a16;color:var(--live)}
.inst{background:var(--card);border:1px solid var(--gd);border-radius:12px}
.rl ol{color:#cdd8de}
.lk a{color:var(--gd)}
.pod div{border-radius:14px;background:var(--card);border:1px solid var(--bd)}
.pod .f{border-color:var(--gd)}
.pod b{font-family:var(--fh);font-weight:700}
button:focus-visible,a:focus-visible{outline:2px solid var(--gd);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.st2{transition:none!important}}

const go=v=>{view=v;R();scrollTo(0,0)};
const det=id=>{sel=id;go("det")};
async function join(id){
  const m=M.find(x=>x.id==id);
  if(!m||J[id])return;
  if(m.mo=="Free Mode"&&new Date().getDay()!==0){alert("Free Mode sirf Sunday ko hota hai");return}if(!ID){alert("Pehle Profile me apna Free Fire Character ID save karo.");go("pro");return}
  if(m.j>=m.x){alert("Ye match full ho chuka hai.");return}
  const f=m.fee||0;
  if(f>0&&bal()<f){alert("Coins kam hain. Is match ki entry "+f+" coins hai, tumhare wallet me "+bal()+" coins hain.");go("coin");return}
  if(!confirm("MATCH RULES\n\n"+RULES.map((r,i)=>(i+1)+". "+r).join("\n\n")+"\n\n"+(f>0?"Entry fee "+f+" coins tumhare wallet se kat jayegi.\n\n":"")+"Kya tum sab rules maante ho aur join karna chahte ho?"))return;
  const {error}=await sb.rpc("join_match",{p_match_id:id,p_ff_id:ID});
  if(error){alert(error.message);return}
  await loadWallet();await loadMatches();R();
}
const RULES=[
 "Free Fire ID ka level 50 ya usse upar hona zaroori hai.",
 "Hack, cheat ya koi bhi unfair tool use karte pakde gaye to account turant permanent ban hoga. Jo bhi payment ya coins lagaye, wapas nahi milenge aur koi reward nahi milega. Tum disqualify ho jaoge.",
 "Do log milkar ek saath khelte pakde gaye (jaise dost saamne baithkar dono khelein ya ek dusre ki help karein) to dono ka account permanent ban hoga. Dono disqualify honge aur kuch bhi nahi milega.",
 "Match khelte time apni screen record karo (poora match, apna Character ID aur level dikhte hue). Jeetne ke baad paisa nikalne (withdraw) se pehle admin ye screen recording maang sakta hai. Recording na dene, adhuri dene ya edit ki hui dene par withdraw nahi hoga.",
 "Galat Character ID dene par account suspend ho sakta hai.",
 "Ye rules har custom match me same lagu hain."];
const jl=m=>m.fee>0?"JOIN · 🪙"+m.fee:"JOIN FREE";
function card(m){
  const p=Math.round(m.j/m.x*100),jn=J[m.id];
  return `<div class="card"><div class="row sp"><div class="row"><div class="ic">🎮</div><div><b>#${m.id} BR Match</b><div class="mu">${m.mo} : ${m.mp}</div></div></div><div class="tag">${m.d}<br><b>${m.tm}</b></div></div>
  <div class="tg"><span>⭐ Level 50+</span>${m.mo=="Free Mode"?'<span>🆓 FREE · Sunday</span>':""}<span>🎯 ${m.ru}</span><span>🔫 ${m.gn}</span></div><div class="row sp"><div><div class="mu">TOTAL REWARD</div><div class="big">₹${m.r}</div></div><button class="pill" onclick="det(${m.id})">View Details ›</button></div>
  <div class="row"><div class="mu">${m.j}/${m.x} Joined</div><div class="bar"><i style="width:${p}%"></i></div><button class="btn ${jn?"off":""}" onclick="join(${m.id})">${jn?"JOINED ✓":jl(m)}</button></div></div>`;
}

function promoGen(){
  const L=gpl();
  return `<div class="card"><b>🎁 Promo Code Banao</b><div class="mu" style="margin:6px 0">Code se user ko coins milenge. Ek user ek code sirf ek baar use kar sakta hai.</div>

  <input class="ci" id="pgm" type="number" inputmode="numeric" placeholder="Kitne log use kar sakein (jaise 20)">
  <button class="btn w100" onclick="genPromo()">CODE BANAO</button>
  ${L.length?`<h3 style="margin:12px 0 6px;font-size:15px">Banaye gaye codes</h3>`+L.slice().reverse().map(x=>`<div class="li"><span><b>${esc(x.c)}</b> · 🪙${x.v} · ${x.m||1} log</span></div>`).join(""):""}</div>`;
}
async function genPromo(){
  const v=Math.floor(+$("pgc").value);
  if(!(v>0)){alert("Coins ki sahi number daalo (1 ya usse zyada)");return}
  let c=$("pgn").value.trim().toUpperCase().replace(/\s/g,"");
  if(!c){const ch="ABCDEFGHJKLMNPQRSTUVWXYZ23456789",r=crypto.getRandomValues(new Uint8Array(8));c="";for(const x of r)c+=ch[x%ch.length]}
  if(!/^[A-Z0-9_-]{4,20}$/.test(c)){alert("Code 4 se 20 akshar ka ho (sirf A-Z aur 0-9)");return}
  const mx=Math.floor(+$("pgm").value);
  if(!(mx>0)){alert("Batao kitne log ye code use kar sakte hain (1 ya usse zyada)");return}
  const {error}=await sb.rpc("create_promo",{p_code:c,p_coins:v,p_max:mx});
  if(error){alert(/duplicate/i.test(error.message)?"Ye code pehle se bana hai":error.message);return}
  const L=gpl();L.push({c,v,m:mx,t:Date.now()});
  try{localStorage.setItem("ffapromolist",JSON.stringify(L))}catch(e){}
  alert("Code ban gaya: "+c+" (🪙"+v+" coins)");R();
}

}
async function addMatch(){

const su=()=>{};
async function loadMe(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){ME="";PROF={};ADM=false;WAL=0;return}
  ME=session.user.id;
  const {data:p}=await sb.from("profiles").select("name,username,mobile,is_admin").eq("id",ME).maybeSingle();
  PROF=p?{name:p.name,username:p.username,mobile:p.mobile}:{};
  ADM=!!(p&&p.is_admin);
  await loadWallet();
  await loadMatches();
  await loadPay();
  await loadNotif();
}
async function loadWallet(){
  const {data}=await sb.from("wallets").select("coins").eq("user_id",ME).maybeSingle();
  WAL=data?data.coins:0;
}
async function loadMatches(){
  if(!ME){M.splice(0,M.length);J={};return}
  const [{data:ms},{data:js}]=await Promise.all([
    sb.from("matches").select("*").order("id"),
    sb.from("match_joins").select("match_id,join_no,ff_id,created_at,user_id,profiles(name,mobile)").order("join_no")
  ]);
  const rows=(ms||[]).map(x=>({id:x.id,mo:x.mode,mp:x.map,ru:x.rules,gn:x.guns,d:x.match_date,tm:x.match_time,r:x.reward,x:x.max_players,j:x.joined_count,fee:x.fee,pl:[]}));
  M.splice(0,M.length,...rows);
  const {data:rs}=await sb.from("match_rooms").select("match_id,room_id,room_pass");
  for(const r of (rs||[])){const m=M.find(z=>z.id==r.match_id);if(m)m.room={id:r.room_id,pass:r.room_pass}}
  J={};
  for(const jn of (js||[])){
    const m=M.find(z=>z.id==jn.match_id);
    if(!m)continue;
    if(jn.user_id==ME)J[m.id]=jn.join_no;
    (m.pl=m.pl||[]).push({u:(jn.profiles&&jn.profiles.mobile)||"",n:(jn.profiles&&jn.profiles.name)||"",ff:jn.ff_id,t:new Date(jn.created_at).getTime()});
  }
}
async function loadPay(){
  if(!ME){WDL=[];PYL=[];NM={};return}
  const [{data:ws},{data:ps}]=await Promise.all([
    sb.from("withdrawals").select("id,user_id,name,mobile,upi,amount,status,profiles(name,mobile)").order("id",{ascending:false}),
    sb.from("payment_requests").select("id,user_id,amount,utr,status,profiles(name)").order("id",{ascending:false})
  ]);
  NM={};
  for(const r of [...(ws||[]),...(ps||[])]){if(r.profiles&&r.profiles.name)NM[r.user_id]=r.profiles.name}
  const okNum=v=>/^[6-9][0-9]{9}$/.test(String(v||""));
  WDL=(ws||[]).map(x=>({id:x.id,u:x.user_id,n:x.name||"",mob:okNum(x.profiles&&x.profiles.mobile)?x.profiles.mobile:(okNum(x.mobile)?x.mobile:""),upi:x.upi,amt:x.amount,s:x.status}));
  PYL=(ps||[]).map(x=>({id:x.id,u:x.user_id,amt:x.amount,utr:x.utr,s:x.status}));
}
async function loadNotif(){
  if(!ME){NT=[];return}
  const {data}=await sb.from("notifications").select("id,message").eq("read",false).order("id");
  NT=data||[];
}
function notifHtml(){
  return NT.map(n=>`<div class="nt" onclick="readNt(${n.id})">🔔 ${esc(n.message)}<br><small>Samajh gaye? Tap karke band karo</small></div>`).join("");
}
async function readNt(id){
  await sb.from("notifications").update({read:true}).eq("id",id).eq("user_id",ME);
  NT=NT.filter(x=>x.id!=id);R();
}
function roomCard(m){
  if(!m.room)return "";
  return `<div class="card" style="border-color:var(--gd)"><b>🏠 Custom Room</b><div class="li"><span>Room ID</span><b>${esc(m.room.id)}</b></div><div class="li"><span>Password</span><b>${esc(m.room.pass)}</b></div></div>`;
}
async function spendCoins(n){
  const {data,error}=await sb.rpc("spend_coins",{p_amt:n});
  if(error){alert(error.message);return false}
  WAL=data;return true;
}
async function doLogin(){
  const q=$("am").value.trim(),p=$("ap").value;
  if(!q||!p){alert("Username ya mobile aur password dono daalo");return}
  const {data:email,error:e1}=await sb.rpc("login_email",{identifier:q});
  if(e1||!email){alert("Username ya mobile number galat hai");return}
  const {error}=await sb.auth.signInWithPassword({email,password:p});
  if(error){alert("Password galat hai");return}
  await loadMe();AV={};R();
}
async function doSign(){
  const n=$("an").value.trim(),un=$("au").value.trim(),m=$("am").value.trim(),p=$("ap").value;
  if(!n||!/^[6-9]\d{9}$/.test(m)){alert("Naam aur sahi 10 digit mobile number daalo");return}
  if(p.length<6||p!=$("ap2").value){alert("Password kam se kam 6 akshar ka ho aur dono baar same ho");return}
  if(!/^[A-Za-z0-9_]{3,15}$/.test(un)){alert("Username 3 se 15 akshar ka ho (sirf A-Z, 0-9 aur _)");return}
  const email=m+"@ffesport.app";
  const {error}=await sb.auth.signUp({email,password:p,options:{data:{name:n,username:un,mobile:m}}});
  if(error){
    const dup=/Database error|duplicate|already/i.test(error.message);
    alert(dup?"Ye username ya mobile number pehle se registered hai":"Account nahi bana: "+error.message);
    return;
  }
  const {error:e2}=await sb.auth.signInWithPassword({email,password:p});
  if(e2){alert("Account ban gaya. Ab login karo.");AM="login";AV={};R();return}
  await loadMe();AV={};R();
}
async function logout(){
  try{await sb.auth.signOut()}catch(e){}
  ME="";PROF={};ADM=false;WAL=0;view="home";AM="login";AV={};R();
}
(async()=>{try{await loadMe()}catch(e){}R()})();
setInterval(async()=>{if(!ME)return;const b=NT.length;await loadNotif();if(NT.length!==b){await loadMatches();R()}},60000);
if("serviceWorker"in navigator&&location.protocol.startsWith("http"))addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
</body>
</html>
